name: WhatsApp Cloudflare compatibility (no deploy)
on:
  pull_request:
    paths:
      - 'experiments/cloudflare-wa-free/**'
      - '.github/workflows/wa-cloudflare-compat-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  baileys-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: experiments/cloudflare-wa-free/compat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Bundle Baileys inside Cloudflare Workers runtime target
        run: npm run build:check
      - name: Test Baileys module loading inside local Workers runtime
        shell: bash
        run: |
          set -euo pipefail
          printf "PROBE_AES_KEY_B64=%s\n" "$(openssl rand -base64 32 | tr -d '\n')" > .dev.vars
          printf "PROBE_ACCESS_TOKEN=%s\n" "$(openssl rand -hex 32)" >> .dev.vars
          chmod 600 .dev.vars
          TEST_TOKEN="$(sed -n 's/^PROBE_ACCESS_TOKEN=//p' .dev.vars)"
          AUTH=(-H "Authorization: Bearer ${TEST_TOKEN}")
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8799/qr || true)" != 200 ] || exit 1
          ./node_modules/.bin/wrangler dev --local --ip 127.0.0.1 --port 8799 > /tmp/sagamente-wa-runtime.log 2>&1 &
          echo $! > /tmp/sagamente-wa-runtime.pid
          trap 'kill "$(cat /tmp/sagamente-wa-runtime.pid)" 2>/dev/null || true; rm -f .dev.vars' EXIT
          OK=0
          for i in $(seq 1 25); do
            if curl --fail --silent --show-error --max-time 3 "${AUTH[@]}" http://127.0.0.1:8799/ -o /tmp/sagamente-wa-runtime.json; then
              OK=1
              break
            fi
            sleep 1
          done
          if [ "$OK" -ne 1 ]; then
            tail -100 /tmp/sagamente-wa-runtime.log
            exit 1
          fi
          curl --fail --silent --show-error --max-time 5 "${AUTH[@]}" http://127.0.0.1:8799/ -o /tmp/sagamente-wa-runtime-again.json
          curl --fail --silent --show-error --max-time 5 "${AUTH[@]}" http://127.0.0.1:8799/auth-adapter-test -o /tmp/sagamente-wa-adapter.json
          node -e 'const x=require("/tmp/sagamente-wa-adapter.json");console.log("Encrypted auth adapter check:",JSON.stringify(x));if(x.authAdapter!==true||x.credsValid!==true||x.keyValid!==true||x.deleted!==true||x.secretSeparated!==true||x.noWhatsAppSocket!==true)process.exit(1)'
          curl --fail --silent --show-error --max-time 5 "${AUTH[@]}" http://127.0.0.1:8799/lifecycle -o /tmp/sagamente-wa-lifecycle.json
          node -e 'const x=require("/tmp/sagamente-wa-lifecycle.json");if(x.bounded!==true||x.closed!==true||x.noWhatsAppSocket!==true||x.productionQueueUntouched!==true||x.credentialFree!==true)process.exit(1);console.log("Offline bounded lifecycle passed.")'
          [ "$(curl --silent -o /dev/null -w '%{http_code}' http://127.0.0.1:8799/qr)" = 401 ]
          [ "$(curl --silent -o /dev/null -w '%{http_code}' "${AUTH[@]}" http://127.0.0.1:8799/qr)" = 501 ]
          echo "Private QR endpoints fail closed."
          # Separate direct edge connectivity from Workers-runtime outbound WebSocket compatibility.
          node --input-type=module -e 'const ws=new WebSocket("wss://sagamente-wa-cloudflare-probe.playmomentsstudios.workers.dev/ws-echo");const timer=setTimeout(()=>{console.error("Remote edge WS timeout");process.exit(1)},8000);ws.onopen=()=>ws.send("sagamente-probe:direct");ws.onmessage=e=>{if(e.data!=="sagamente-probe:direct")process.exit(1);console.log("Direct Cloudflare edge WebSocket passed.");ws.close();clearTimeout(timer);process.exit(0)};ws.onerror=()=>{console.error("Direct Cloudflare edge WebSocket failed");process.exit(1)}'
          # External echo services may be temporarily unavailable: capture result, do not treat it as WhatsApp viability.
          curl --fail --silent --show-error --max-time 15 "${AUTH[@]}" http://127.0.0.1:8799/outbound-ws-test -o /tmp/sagamente-wa-outbound.json
          node -e 'const x=require("/tmp/sagamente-wa-outbound.json");console.log("Bounded outbound WebSocket probe:",JSON.stringify(x));if(x.noWhatsAppSocket!==true||x.outboundEstablished!==true||x.echoReceived!==true||x.closed!==true)process.exit(1)'
          node -e 'const fs=require("fs");const a=JSON.parse(fs.readFileSync("/tmp/sagamente-wa-runtime.json","utf8"));const b=JSON.parse(fs.readFileSync("/tmp/sagamente-wa-runtime-again.json","utf8"));if(a.bundled!==true||a.offlineKeyGeneration!==true||a.credentialRoundTrip!==true||a.keyStoreRoundTrip!==true||a.persistentStorage!==true||a.recordExistedBeforeRequest!==false||b.recordExistedBeforeRequest!==true||b.credentialRoundTrip!==true||b.keyStoreRoundTrip!==true||a.noSessionStarted!==true||a.isProductionSecure!==false||a.testKeyStoredAlongsideCiphertext!==false||a.secretConfigured!==true)process.exit(1);console.log("Durable Object persisted real-format Baileys credentials between requests; still offline-only.")'
