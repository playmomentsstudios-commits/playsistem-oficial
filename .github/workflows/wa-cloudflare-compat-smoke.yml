name: WhatsApp Cloudflare compatibility (no deploy)
on:
  pull_request:
    paths:
      - 'experiments/cloudflare-wa-free/**'
      - '.github/workflows/wa-cloudflare-compat-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  baileys-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: experiments/cloudflare-wa-free/compat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Bundle Baileys inside Cloudflare Workers runtime target
        run: npm run build:check
      - name: Test Baileys module loading inside local Workers runtime
        shell: bash
        run: |
          set -euo pipefail
          ./node_modules/.bin/wrangler dev --local --ip 127.0.0.1 --port 8799 > /tmp/sagamente-wa-runtime.log 2>&1 &
          echo $! > /tmp/sagamente-wa-runtime.pid
          trap 'kill "$(cat /tmp/sagamente-wa-runtime.pid)" 2>/dev/null || true' EXIT
          OK=0
          for i in $(seq 1 25); do
            if curl --fail --silent --show-error --max-time 3 http://127.0.0.1:8799/ -o /tmp/sagamente-wa-runtime.json; then
              OK=1
              break
            fi
            sleep 1
          done
          if [ "$OK" -ne 1 ]; then
            tail -100 /tmp/sagamente-wa-runtime.log
            exit 1
          fi
          node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync("/tmp/sagamente-wa-runtime.json","utf8"));if(x.bundled!==true||x.browserApi!==true||x.noSessionStarted!==true||x.offlineKeyGeneration!==true||x.credentialRoundTrip!==true||x.noStorageOfKeys!==true)process.exit(1);console.log("Baileys loaded; offline key generation and serialization passed.")'
