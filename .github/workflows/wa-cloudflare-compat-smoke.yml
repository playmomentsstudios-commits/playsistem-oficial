name: WhatsApp Cloudflare compatibility (no deploy)
on:
  pull_request:
    paths:
      - 'experiments/cloudflare-wa-free/**'
      - '.github/workflows/wa-cloudflare-compat-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  baileys-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: experiments/cloudflare-wa-free/compat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Bundle Baileys inside Cloudflare Workers runtime target
        run: npm run build:check
      - name: Test Baileys module loading inside local Workers runtime
        shell: bash
        run: |
          set -euo pipefail
          ./node_modules/.bin/wrangler dev --local --ip 127.0.0.1 --port 8799 > /tmp/sagamente-wa-runtime.log 2>&1 &
          echo $! > /tmp/sagamente-wa-runtime.pid
          trap 'kill "$(cat /tmp/sagamente-wa-runtime.pid)" 2>/dev/null || true' EXIT
          OK=0
          for i in $(seq 1 25); do
            if curl --fail --silent --show-error --max-time 3 http://127.0.0.1:8799/ -o /tmp/sagamente-wa-runtime.json; then
              OK=1
              break
            fi
            sleep 1
          done
          if [ "$OK" -ne 1 ]; then
            tail -100 /tmp/sagamente-wa-runtime.log
            exit 1
          fi
          curl --fail --silent --show-error --max-time 5 http://127.0.0.1:8799/ -o /tmp/sagamente-wa-runtime-again.json
          curl --fail --silent --show-error --max-time 5 http://127.0.0.1:8799/lifecycle -o /tmp/sagamente-wa-lifecycle.json
          node -e 'const x=require("/tmp/sagamente-wa-lifecycle.json");if(x.bounded!==true||x.closed!==true||x.noWhatsAppSocket!==true||x.productionQueueUntouched!==true||x.credentialFree!==true)process.exit(1);console.log("Offline bounded lifecycle passed.")'
          node --input-type=module -e 'const ws=new WebSocket("ws://127.0.0.1:8799/ws-test");const stop=setTimeout(()=>{console.error("websocket timeout");process.exit(1)},7000);ws.onopen=()=>ws.send("probe:ping");ws.onmessage=e=>{if(e.data!=="probe:pong")process.exit(1);clearTimeout(stop);ws.close();console.log("Real Durable Object WebSocket ping/pong passed.")};ws.onerror=()=>process.exit(1);ws.onclose=()=>{clearTimeout(stop);process.exit(0)}'
          # Separate direct edge connectivity from Workers-runtime outbound WebSocket compatibility.
          node --input-type=module -e 'const ws=new WebSocket("wss://sagamente-wa-cloudflare-probe.playmomentsstudios.workers.dev/ws-echo");const timer=setTimeout(()=>{console.error("Remote edge WS timeout");process.exit(1)},8000);ws.onopen=()=>ws.send("sagamente-probe:direct");ws.onmessage=e=>{if(e.data!=="sagamente-probe:direct")process.exit(1);console.log("Direct Cloudflare edge WebSocket passed.");ws.close();clearTimeout(timer);process.exit(0)};ws.onerror=()=>{console.error("Direct Cloudflare edge WebSocket failed");process.exit(1)}'
          # External echo services may be temporarily unavailable: capture result, do not treat it as WhatsApp viability.
          curl --fail --silent --show-error --max-time 15 http://127.0.0.1:8799/outbound-ws-test -o /tmp/sagamente-wa-outbound.json
          node -e 'const x=require("/tmp/sagamente-wa-outbound.json");console.log("Bounded outbound WebSocket probe:",JSON.stringify(x));if(x.noWhatsAppSocket!==true||x.outboundEstablished!==true||x.echoReceived!==true||x.closed!==true)process.exit(1)'
          node -e 'const fs=require("fs");const a=JSON.parse(fs.readFileSync("/tmp/sagamente-wa-runtime.json","utf8"));const b=JSON.parse(fs.readFileSync("/tmp/sagamente-wa-runtime-again.json","utf8"));if(a.bundled!==true||a.offlineKeyGeneration!==true||a.credentialRoundTrip!==true||a.keyStoreRoundTrip!==true||a.persistentStorage!==true||a.recordExistedBeforeRequest!==false||b.recordExistedBeforeRequest!==true||b.credentialRoundTrip!==true||b.keyStoreRoundTrip!==true||a.noSessionStarted!==true||a.isProductionSecure!==false)process.exit(1);console.log("Durable Object persisted real-format Baileys credentials between requests; still offline-only.")'
