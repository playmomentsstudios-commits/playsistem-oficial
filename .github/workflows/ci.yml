name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      - name: Validate local WhatsApp bridge dependencies
        run: |
          npm install --no-audit --no-fund --prefix services/whatsapp-bridge
          cd services/whatsapp-bridge
          node --check index.mjs
          node --input-type=module -e "import('@whiskeysockets/baileys').then(m=>{if(typeof m.default!=='function'||typeof m.useMultiFileAuthState!=='function')process.exit(1)})"

      - name: Build
        run: pnpm build

      - name: Validate Cloudflare Worker bundle
        run: pnpm dlx wrangler@4 deploy --dry-run --outdir /tmp/sagamente-pwa-worker

      - name: Diff check
        run: git diff --check
