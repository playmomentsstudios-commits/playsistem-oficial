name: Academia Sagamente PWA
on:
  pull_request:
    paths:
      - 'academy-app/**'
      - 'src/academy/**'
      - 'worker/academy-standalone.js'
      - 'wrangler.academia.jsonc'
      - 'vite.academia.config.ts'
      - 'package.json'
      - 'src/components/academy/**'
      - 'src/pages/customer/Academy**'
      - '.github/workflows/academia-pwa.yml'
  push:
    branches: [main]
    paths:
      - 'academy-app/**'
      - 'src/academy/**'
      - 'worker/academy-standalone.js'
      - 'wrangler.academia.jsonc'
      - 'vite.academia.config.ts'
      - 'package.json'
      - 'src/components/academy/**'
      - 'src/pages/customer/Academy**'
      - '.github/workflows/academia-pwa.yml'
permissions:
  contents: read
jobs:
  validate:
    name: Standalone build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '10.30.3'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: node --test tests/academia-standalone.test.mjs
      - run: pnpm run build:academia
      - run: node scripts/check-academia-css.mjs
      - name: Verify independent site shell
        run: |
          test -f dist-academia/index.html
          test -d dist-academia/assets
          grep -q 'academia-manifest.webmanifest' dist-academia/index.html

  deploy:
    name: Deploy Academia to Cloudflare
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: academy-sagamente-cloudflare
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '10.30.3'
      - run: pnpm install --frozen-lockfile
      - name: Build standalone Academia assets
        run: pnpm run build:academia
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - name: Confirm Cloudflare deployment credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
      - name: Publish only the academia-sagamente Worker
        run: pnpm dlx wrangler@4 deploy --config wrangler.academia.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
