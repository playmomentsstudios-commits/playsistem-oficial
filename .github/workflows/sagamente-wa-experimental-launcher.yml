name: Sagamente WA Experimental Deployment Launcher
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type DEPLOY_ISOLATED_PROBE to deploy only the experimental Worker'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: sagamente-wa-experimental-launcher
  cancel-in-progress: false
jobs:
  isolated-deploy:
    if: ${{ inputs.confirmation == 'DEPLOY_ISOLATED_PROBE' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: 'cloudflare whatsistem'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 37293d0cc3389330a24f5e4565bca55de1416444
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check isolated deployment inputs
        shell: bash
        working-directory: experiments/cloudflare-wa-free/compat
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PROBE_AES_KEY_B64: ${{ secrets.PROBE_AES_KEY_B64 }}
          PROBE_ACCESS_TOKEN: ${{ secrets.PROBE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "::error::Missing isolated CLOUDFLARE_API_TOKEN"; exit 1; }
          node - <<'NODE'
          const x=process.env.PROBE_AES_KEY_B64||"";
          const y=process.env.PROBE_ACCESS_TOKEN||"";
          if(!/^[A-Za-z0-9+/]{43}=$/.test(x)||Buffer.from(x,"base64").length!==32||y.length<32){
            throw Error("Invalid/missing isolated secrets");
          }
          console.log("Isolated secret formats validated");
          NODE
          node - <<'NODE'
          const fs=require("node:fs");
          const cfg=JSON.parse(fs.readFileSync("wrangler.remote.jsonc","utf8"));
          if(cfg.name!=="sagamente-wa-baileys-remote-probe"||cfg.vars?.EXPERIMENTAL_PAIRING_ENABLED!=="false"){
            throw Error("Worker target is not the isolated, fail-closed probe");
          }
          console.log("Target verified:",cfg.name);
          NODE
      - name: Install and compile
        working-directory: experiments/cloudflare-wa-free/compat
        run: |
          npm install --no-audit --no-fund
          npx wrangler deploy --dry-run --config wrangler.remote.jsonc
      - name: Deploy isolated Worker only
        working-directory: experiments/cloudflare-wa-free/compat
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: c266e6cfc3a50abf60cc8c0e299bf467
          PROBE_AES_KEY_B64: ${{ secrets.PROBE_AES_KEY_B64 }}
          PROBE_ACCESS_TOKEN: ${{ secrets.PROBE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          printf %s "$PROBE_AES_KEY_B64" | npx wrangler secret put PROBE_AES_KEY_B64 --config wrangler.remote.jsonc
          printf %s "$PROBE_ACCESS_TOKEN" | npx wrangler secret put PROBE_ACCESS_TOKEN --config wrangler.remote.jsonc
          npx wrangler deploy --config wrangler.remote.jsonc
      - name: Verify remote health and fail-closed access after propagation
        shell: bash
        run: |
          set -euo pipefail
          URL="https://sagamente-wa-baileys-remote-probe.playmomentsstudios.workers.dev"
          HEALTH_OK=false
          STATUS_OK=false
          for attempt in $(seq 1 20); do
            H_CODE="$(curl --silent --show-error --max-time 10 -o /tmp/wa-remote-health.json -w '%{http_code}' "$URL/health" || true)"
            if [ "$H_CODE" = "200" ] && node - <<'NODE'
          const fs=require("node:fs");
          let h;
          try { h=JSON.parse(fs.readFileSync("/tmp/wa-remote-health.json","utf8")); } catch { process.exit(1); }
          if(h.service!=="baileys-isolated-probe"||h.ready!==false||h.noWhatsAppSocket!==true)process.exit(1);
          NODE
            then HEALTH_OK=true; fi
            START_CODE="$(curl --silent --show-error --max-time 10 -o /dev/null -w '%{http_code}' "$URL/start" || true)"
            QR_CODE="$(curl --silent --show-error --max-time 10 -o /dev/null -w '%{http_code}' "$URL/qr" || true)"
            echo "Remote readiness attempt $attempt: health=$H_CODE start=$START_CODE qr=$QR_CODE"
            if [ "$HEALTH_OK" = true ] && [ "$START_CODE" = "401" ] && [ "$QR_CODE" = "401" ]; then
              STATUS_OK=true
              break
            fi
            sleep 3
          done
          [ "$STATUS_OK" = true ] || { echo "::error::Remote verification failed after retries"; exit 1; }
          echo "Isolated Baileys bundle deployed. Unauthorized access blocked. Pairing disabled."
