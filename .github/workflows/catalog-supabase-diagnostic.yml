name: Catalog Supabase diagnostic

on:
  push:
    branches:
      - diag/catalog-supabase-public
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Query public catalog endpoints
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          ;(async () => {
          const source = fs.readFileSync('utils/supabase/info.tsx', 'utf8')
          const projectId = source.match(/projectId\s*=\s*"([^"]+)"/)?.[1]
          const anonKey = source.match(/publicAnonKey\s*=\s*"([^"]+)"/)?.[1]
          if (!projectId || !anonKey) throw new Error('Missing public Supabase fallback config')

          const base = `https://${projectId}.supabase.co/rest/v1`
          const headers = {
            apikey: anonKey,
            Authorization: `Bearer ${anonKey}`,
            Prefer: 'count=exact',
          }

          try {
            const liveHtml = await (await fetch('https://playsistem-oficial.playmomentsstudios.workers.dev/')).text()
            const assetMatches = [...liveHtml.matchAll(/(?:src|href)=["']([^"']+\.(?:js|mjs))["']/g)].map(match => match[1])
            const jsAsset = assetMatches.find(asset => asset.includes('/assets/')) ?? assetMatches[0] ?? null
            let deployedSupabaseRefs = []
            let deployedProjectRefs = []
            if (jsAsset) {
              const assetUrl = new URL(jsAsset, 'https://playsistem-oficial.playmomentsstudios.workers.dev/').href
              const bundle = await (await fetch(assetUrl)).text()
              deployedSupabaseRefs = [...new Set([...bundle.matchAll(/https:\/\/([a-z0-9]{20})\.supabase\.co/g)].map(match => match[1]))]
              deployedProjectRefs = [...new Set([...bundle.matchAll(/\b[a-z0-9]{20}\b/g)].map(match => match[0]))].filter(ref => ref === projectId || ref === 'rpkkpgigddazlneprunh' || ref === 'lfmjqctiutajgtacvxfq')
            }
            console.log(JSON.stringify({
              name: 'live_bundle',
              jsAsset,
              deployedSupabaseRefs,
              deployedProjectRefs,
              expectedProjectId: projectId,
            }))
          } catch (error) {
            console.log(JSON.stringify({ name: 'live_bundle', error: String(error) }))
          }

          const probes = [
            ['products', '/products?select=id&active=eq.true&status=eq.published&limit=1'],
            ['services', '/services?select=id&active=eq.true&status=eq.published&limit=1'],
            ['product_categories', '/product_categories?select=id&limit=1'],
            ['product_images', '/product_images?select=id&limit=1'],
            ['products_relational', '/products?select=id,product_images(id),category:product_categories(id)&active=eq.true&status=eq.published&limit=1'],
          ]

          const catalogResponse = await fetch(base + '/products?select=id,name,slug,product_type,commercial_mode,specifications,category_id,sale_price,rental_daily_price&active=eq.true&status=eq.published&limit=500', { headers })
          const catalogRows = catalogResponse.ok ? await catalogResponse.json() : []
          const byType = {}
          const byMode = {}
          let serviceTagged = 0
          let nonService = 0
          let equipmentLike = 0
          for (const row of catalogRows) {
            const kind = String(row?.specifications?.catalog_kind ?? '').toLowerCase().trim()
            if (kind === 'service') serviceTagged += 1
            else nonService += 1
            byType[row.product_type ?? 'null'] = (byType[row.product_type ?? 'null'] ?? 0) + 1
            byMode[row.commercial_mode ?? 'null'] = (byMode[row.commercial_mode ?? 'null'] ?? 0) + 1
            if (row.product_type === 'equipment') equipmentLike += 1
          }
          console.log(JSON.stringify({
            name: 'catalog_summary',
            status: catalogResponse.status,
            total: catalogRows.length,
            serviceTagged,
            nonService,
            equipmentLike,
            byType,
            byMode,
            sample: catalogRows.slice(0, 6).map(row => ({
              name: row.name,
              slug: row.slug,
              kind: row?.specifications?.catalog_kind ?? null,
              product_type: row.product_type,
              commercial_mode: row.commercial_mode,
              sale_price: row.sale_price,
              rental_daily_price: row.rental_daily_price,
            })),
          }))

          for (const [name, path] of probes) {
            try {
              const response = await fetch(base + path, { headers })
              const body = await response.text()
              const range = response.headers.get('content-range')
              console.log(JSON.stringify({
                name,
                status: response.status,
                contentRange: range,
                ok: response.ok,
                error: response.ok ? null : body.slice(0, 1200),
              }))
            } catch (error) {
              console.log(JSON.stringify({
                name,
                status: 0,
                ok: false,
                error: String(error),
              }))
            }
          }
          })().catch(error => { console.error(error); process.exit(1) })
          NODE
