name: Catalog Supabase diagnostic

on:
  push:
    branches:
      - diag/catalog-supabase-public
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Query public catalog endpoints
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const source = fs.readFileSync('utils/supabase/info.tsx', 'utf8')
          const projectId = source.match(/projectId\s*=\s*"([^"]+)"/)?.[1]
          const anonKey = source.match(/publicAnonKey\s*=\s*"([^"]+)"/)?.[1]
          if (!projectId || !anonKey) throw new Error('Missing public Supabase fallback config')

          const base = `https://${projectId}.supabase.co/rest/v1`
          const headers = {
            apikey: anonKey,
            Authorization: `Bearer ${anonKey}`,
            Prefer: 'count=exact',
          }

          const probes = [
            ['products', '/products?select=id&active=eq.true&status=eq.published&limit=1'],
            ['services', '/services?select=id&active=eq.true&status=eq.published&limit=1'],
            ['product_categories', '/product_categories?select=id&limit=1'],
            ['product_images', '/product_images?select=id&limit=1'],
            ['products_relational', '/products?select=id,product_images(id),category:product_categories(id)&active=eq.true&status=eq.published&limit=1'],
          ]

          for (const [name, path] of probes) {
            try {
              const response = await fetch(base + path, { headers })
              const body = await response.text()
              const range = response.headers.get('content-range')
              console.log(JSON.stringify({
                name,
                status: response.status,
                contentRange: range,
                ok: response.ok,
                error: response.ok ? null : body.slice(0, 1200),
              }))
            } catch (error) {
              console.log(JSON.stringify({
                name,
                status: 0,
                ok: false,
                error: String(error),
              }))
            }
          }
          NODE
